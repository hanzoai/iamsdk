name: CI/CD
# The ~7-line caller: triggers plus the import. Every knob is in /hanzo.yml,
# which platform.hanzo.ai reads too.
#
# The uses: path is the .hanzo one. Reusables are resolved through the same
# WORKFLOW_DIRS allowlist that collects workflows, and hanzoai/ci carries
# build.yml at both paths from the same @v1 tag — the .hanzo path is the one
# that survives .github/workflows leaving that list.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cicd:
    uses: hanzoai/ci/.hanzo/workflows/build.yml@v1
    secrets: inherit
